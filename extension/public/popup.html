<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kestrel</title>
    <style>
      :root { color-scheme: dark light; }
      body { font: 13px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; margin: 0; width: 300px; background: #0f1117; color: #e6e8ee; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
      header b { font-size: 14px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
      .dot.on { background: #22c55e; } .dot.warn { background: #f59e0b; } .dot.err { background: #ef4444; }
      main { padding: 0 14px 14px; display: grid; gap: 10px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .muted { color: #9aa1ad; font-size: 12px; }
      label { display: grid; gap: 4px; font-size: 12px; color: #9aa1ad; }
      input { font: inherit; padding: 7px 8px; border-radius: 6px; border: 1px solid #2a2f3a; background: #171a22; color: inherit; }
      button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #2a2f3a; background: #1c2029; color: inherit; cursor: pointer; }
      button.primary { background: #f5a524; color: #1a1300; border-color: transparent; font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      .err { color: #f87171; font-size: 12px; }
      .ok { color: #4ade80; font-size: 12px; }
      details summary { cursor: pointer; color: #9aa1ad; font-size: 12px; }
      .grid2 { display: grid; grid-template-columns: 1fr 72px; gap: 8px; }
    </style>
  </head>
  <body>
    <header><span id="dot" class="dot"></span><b>Kestrel</b><span id="conn" class="muted">Not connected</span></header>
    <main>
      <div class="row"><span>Meet call</span><span id="call" class="muted">—</span></div>
      <div class="row"><span>Tab audio capture</span><span id="cap" class="muted">Off</span></div>
      <div class="row"><span>Captions backup</span><span id="captions" class="muted">Off</span></div>
      <div id="error" class="err" hidden></div>
      <button id="toggle" class="primary">Start capture</button>
      <details id="pair">
        <summary>Pairing</summary>
        <div class="grid2" style="margin-top:8px">
          <label>Pairing token<input id="token" placeholder="From Kestrel → Settings → Audio" autocomplete="off" /></label>
          <label>Port<input id="port" type="number" min="1024" max="65535" /></label>
        </div>
        <label style="margin-top:8px;flex-direction:row;display:flex;align-items:center;gap:6px"><input id="auto" type="checkbox" style="width:auto" /> Start capture automatically when I join a call</label>
        <div class="row" style="margin-top:8px"><button id="save">Save &amp; test</button><span id="test" class="muted"></span></div>
      </details>
      <div class="muted">Kestrel must be running on this computer. Capture only works after you click this icon (or press Alt+Shift+K) on the Meet tab once.</div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
