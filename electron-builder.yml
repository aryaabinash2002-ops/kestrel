appId: app.kestrel.copilot
productName: Kestrel
copyright: Copyright © 2026 Kestrel
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
extraResources:
  - from: extension/dist
    to: extension
    filter: ['**/*']
npmRebuild: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Kestrel needs your microphone to transcribe your side of the conversation.
    NSAudioCaptureUsageDescription: Kestrel captures system audio to transcribe the other participants of your call.
    NSScreenCaptureUsageDescription: Kestrel captures your screen only when you press the "Solve what's on screen" hotkey.
    NSCameraUsageDescription: Kestrel does not use your camera.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
publish: null
